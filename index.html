<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0d10">
<!-- GitHub Pages cannot set response headers, so this is the only CSP available.
     It cannot express frame-ancestors, but it does constrain what a swapped CDN
     script could do: connect-src 'self' means it cannot POST the stored parked
     location anywhere. MapLibre needs blob: workers and sets inline styles. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com blob:; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src blob: 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sweeping">
<title>Street Sweeping</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css"
      integrity="sha384-K282sW/zFjTkrjR/+yr1H+gCukuy4OEYrkXRybV88g7pk+kZZYpNV6SAV59NcgFg"
      crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="style.css?v=30">
</head>
<body>

<div id="app" class="app">

  <!-- Overhead view: the block, both kerbs, and your car. -->
  <section id="stage" class="stage" aria-label="Your car on this block">
    <svg id="scene" class="scene" viewBox="0 0 360 460" preserveAspectRatio="xMidYMid slice"
         aria-hidden="true">
      <defs>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#0b0d10" stop-opacity="1"/>
          <stop offset=".18" stop-color="#0b0d10" stop-opacity="0"/>
          <stop offset=".82" stop-color="#0b0d10" stop-opacity="0"/>
          <stop offset="1"   stop-color="#0b0d10" stop-opacity="1"/>
        </linearGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Everything below is drawn from the block's real geometry at load.
           The camera group is what flies; the geometry underneath never moves. -->
      <g id="camera">
      <g id="context" class="context"></g>
      <path id="road" class="road" d=""></path>
      <path id="centerline" class="centerline" d=""></path>
      <path id="kerbA" class="kerb" d=""></path>
      <path id="kerbB" class="kerb" d=""></path>

      <!-- A sweeper that actually drives the kerb being swept. Whimsy that also
           answers the question: it shows you WHICH side is in trouble. -->
      <g id="sweeper" class="sweeper" hidden>
        <ellipse class="sweep-dust" cx="0" cy="9" rx="9" ry="5"/>
        <rect class="sweep-body" x="-5.5" y="-10" width="11" height="20" rx="3"/>
        <rect class="sweep-cab" x="-4" y="-7.5" width="8" height="6" rx="2"/>
        <circle class="sweep-brush" cx="0" cy="8" r="3.6"/>
      </g>

      <g id="car" class="car">
        <rect class="car-body" x="-5" y="-11" width="10" height="22" rx="3"/>
        <rect class="car-glass" x="-3.6" y="-7" width="7.2" height="5.5" rx="1.6"/>
        <rect class="car-glass" x="-3.6" y="2.6" width="7.2" height="4.6" rx="1.6"/>
        <rect class="car-roof" x="-3.2" y="-1" width="6.4" height="3.4" rx="1.4"/>
      </g>

      </g>
      <rect class="vignette" x="0" y="0" width="360" height="460" fill="url(#fade)"/>
    </svg>

    <!-- kerb labels, in HTML so they stay upright and legible -->
    <button id="labelA" class="kerb-label" type="button" hidden></button>
    <button id="labelB" class="kerb-label kerb-label--b" type="button" hidden></button>

    <div id="compassRose" class="rose" hidden aria-hidden="true">
      <span id="needle" class="needle"></span>
    </div>
    <p id="facing" class="facing" hidden></p>
    <button id="aim" class="aim" type="button" hidden>
      Point the phone the way your car faces, then tap here
    </button>

    <div id="parked" class="parked" hidden></div>
  </section>

  <!-- Verdict + actions -->
  <section id="panel" class="panel" aria-live="polite">
    <div id="status" class="status" role="status">Finding your spot…</div>

    <div id="recall" class="recall" hidden></div>
    <div id="rival" class="rival" hidden></div>

    <div id="detail" class="detail" hidden>
      <h1 id="street">—</h1>
      <p id="prompt" class="prompt">Tap the kerb your car is on.</p>

      <div id="curb" class="curb" hidden></div>

      <div id="confirm" class="confirm" hidden></div>

      <div id="verdict" class="verdict" hidden>
        <p id="headline" class="headline">—</p>
        <p id="sub" class="sub"></p>
        <p id="note" class="note" hidden></p>
      </div>

      <div id="overflow" class="overflow" hidden></div>

      <div id="permit" class="permit" hidden></div>

      <div id="limits" class="limits" hidden></div>

      <div class="actions">
        <button id="timer" class="btn btn--primary" type="button" hidden>Timer</button>
        <button id="showmap" class="btn" type="button">Map</button>
        <button id="showcompass" class="btn" type="button" hidden>Compass</button>
        <button id="remind" class="btn btn--quiet" type="button" hidden>Calendar</button>
      </div>

      <footer class="legal">
        <strong>Posted signs control.</strong> Advisory only — city data is
        transcribed and can be stale.
        <span class="minor">
          <button id="report" class="link" type="button">Sign differs?</button>
          <button id="timername" class="link" type="button">Timer shortcut</button>
          <button id="forget" class="link" type="button" hidden>Forget my spot</button>
        </span>
        <span id="vintage" class="vintage"></span>
      </footer>
    </div>
  </section>
</div>

<!-- Real map, on demand, to confirm the block -->
<div id="mapwrap" class="mapwrap" hidden>
  <div id="map"></div>
  <button id="closemap" class="btn btn--float" type="button">Done</button>
</div>

<!-- Pinned with SRI: this script runs in the app's origin and can read the
     stored parked-car location, so a compromised CDN must not be able to swap it. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"
        integrity="sha384-KKgyz2mG25bKJ1O2PyqTJPlAF8Kw2BpDmsLTNBXslICOBvhTAyF5F0XhLWF2ZovY"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="app.js?v=30"></script>
</body>
</html>
